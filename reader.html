<style>

html{font-size:100%;scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC",sans-serif}

.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;padding:12px;border-radius:10px;text-align:left;color:#454842}.nav .active{background:var(--cream);font-weight:700;color:var(--forest)}

.coming{margin-top:16px;padding:10px;border:1px dashed var(--line);border-radius:9px;color:var(--muted);font-size:12px;line-height:1.4}
main{min-width:0}.topbar{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 26px;position:sticky;top:0;background:rgba(251,250,247,.95);backdrop-filter:blur(12px);z-index:5}
.topbar select,.menu{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:10px 12px}.book{min-width:230px}.menu{display:none}.spacer{flex:1}
.reader{max-width:880px;margin:0 auto;padding:34px 42px 96px}
.heading{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}.heading h1{margin:0;font-family:Georgia,"Noto Serif TC",serif;font-size:30px}.heading span{font-size:14px;color:var(--muted)}
.testament{margin:18px 0 12px;color:var(--gold);font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.translation-note{font-size:12px;color:var(--muted);margin:0 0 14px}
.verse{display:grid;grid-template-columns:34px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid #EEE8DF}.num{color:var(--gold);font-family:Georgia,serif;padding-top:4px}
.content{display:flex;flex-direction:column;gap:5px}.zh{font-family:"Noto Serif TC","Songti TC","PingFang TC",serif;font-size:calc(1.25rem * var(--readerScale,1));line-height:1.62;margin:0}.en{font-family:Georgia,"Times New Roman",serif;font-size:calc(1.08rem * var(--readerScale,1));line-height:1.62;color:#3E403C;margin:0}.py{font-size:calc(.84rem * var(--readerScale,1));line-height:1.55;color:#4C7566;margin:0}
.side .content{display:grid;grid-template-columns:1fr 1fr;gap:36px}.loading,.error{padding:70px 10px;text-align:center;color:var(--muted);line-height:1.6}.error{color:#8A4C40}.retry{margin-top:12px;border:1px solid var(--line);background:#fff;padding:9px 13px;border-radius:9px;cursor:pointer}
.footer-note{margin:24px 0 0 46px;color:var(--muted);font-size:11px;line-height:1.55}.verse-rail{display:flex;flex-direction:column;align-items:center;gap:7px;padding-top:4px}.verse-tools{display:flex;gap:6px;margin:0}.verse-tool{border:0;background:transparent;color:var(--gold);width:24px;height:28px;cursor:pointer;padding:0;display:grid;place-items:center}.verse-tool svg{width:18px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.verse-tool.saved svg{fill:var(--gold);stroke:var(--gold)}.searchbar{display:none;gap:8px;align-items:center;padding:12px 0 18px}.searchbar.open{display:flex}.searchbar input{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px 13px;font-size:15px}.searchbar button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;cursor:pointer}.search-hit{background:#fff3cf;border-radius:8px}.search-heading{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:4px 0 16px}.search-heading h2{font-family:Georgia,"Noto Serif TC",serif;font-size:28px;margin:0}.search-heading span{color:var(--muted);font-size:13px}.search-results{display:grid;gap:10px}.search-result{border:1px solid var(--line);background:#fff;border-radius:12px;padding:14px 16px;cursor:pointer}.search-result:hover{border-color:var(--gold)}.search-result strong{display:block;color:var(--forest);margin-bottom:6px}.search-result p{margin:0;line-height:1.5}.search-result small{display:block;color:var(--muted);margin-top:7px}.search-status{color:var(--muted);padding:24px 0}.settings-view{max-width:760px}.settings-section{border:1px solid var(--line);background:#fff;border-radius:14px;padding:18px;margin:0 0 14px}.settings-section h3{margin:0 0 8px;color:var(--forest);font-size:17px}.settings-section p{margin:0;color:var(--muted);font-size:13px;line-height:1.5}.setting-row{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:12px 0;border-top:1px solid #eee8df}.setting-row:first-of-type{border-top:0}.setting-label strong{display:block;font-size:14px}.setting-label span{display:block;color:var(--muted);font-size:12px;margin-top:3px}.setting-control select,.setting-control input[type=text]{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 10px}.mini-btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 12px;cursor:pointer}.danger-btn{color:#8a4c40}.settings-note{background:#fbf5eb;border-radius:12px;padding:14px;color:#665f55;font-size:12px;line-height:1.5}.sync-badge{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:5px 8px;font-size:11px;color:var(--muted);margin-top:8px}.panel-title{font-family:Georgia,"Noto Serif TC",serif;font-size:28px;margin:0 0 18px}.bookmark-list{display:grid;gap:10px}.bookmark-card{border:1px solid var(--line);background:#fff;border-radius:12px;padding:14px;cursor:pointer}.bookmark-card strong{display:block;margin-bottom:6px;color:var(--forest)}.bookmark-card p{margin:0;color:var(--muted);line-height:1.45}.empty{color:var(--muted);padding:28px 0}.chapter-nav{display:flex;justify-content:space-between;gap:12px;margin:38px 0 0 46px}.chapter-nav button{min-height:44px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 16px;color:var(--forest);cursor:pointer}.chapter-nav button:disabled{opacity:.35;cursor:default}.reader-tools{display:flex;gap:8px;align-items:center}.toolbtn{min-width:44px;min-height:44px;border:1px solid var(--line);background:#fff;border-radius:10px;color:var(--forest);cursor:pointer;font-weight:700}.skip{position:absolute;left:-9999px;top:8px;background:var(--forest);color:#fff;padding:10px 14px;border-radius:8px;z-index:99}.skip:focus{left:8px}.verse:target{background:#fbf5eb}.verse{scroll-margin-top:80px}.content.side-by-side{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:44px;align-items:start}.content.side-by-side .zhcol,.content.side-by-side .encol{min-width:0}.content.side-by-side .zhcol{display:flex;flex-direction:column;gap:6px}@media(max-width:760px){.content.side-by-side{grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:16px;row-gap:0}.content.side-by-side .zh{font-size:.92rem;line-height:1.48}.content.side-by-side .py{font-size:.68rem;line-height:1.38}.content.side-by-side .en{font-size:.82rem;line-height:1.48}}
.scrim{display:none}
@media(max-width:800px){
  .app{display:block}aside{position:fixed;left:0;top:0;bottom:0;width:min(84vw,300px);height:100vh;z-index:21;transform:translateX(-100%);transition:.18s;background:#F8F4ED}.app.open aside{transform:translateX(0)}
  .scrim{position:fixed;inset:0;background:rgba(15,31,26,.25);z-index:20}.app.open .scrim{display:block}
  .menu{display:block}.topbar{height:60px;padding:0 12px;overflow:auto}.book{min-width:180px}.reader{padding:24px 17px 72px}.heading h1{font-size:24px}.verse{grid-template-columns:32px 1fr;gap:8px;padding:8px 0}.zh{font-size:calc(20px * var(--readerScale,1));line-height:1.4}.en{font-size:calc(17px * var(--readerScale,1));line-height:1.42}.side .content{display:flex;flex-direction:column;gap:5px}.footer-note{margin-left:35px}
}
</style>
</head>
<body>
<a class="skip" href="#reader">Skip to Scripture</a>
<div class="app" id="app">
<div class="scrim" id="scrim"></div>
<aside>
  <a class="brand" href="index.html" style="display:block;text-decoration:none"><span class="cn">同道</span>Bible</a>
  <nav class="nav">
    <button id="homeBtn">首頁 Home</button>
    <button class="active" id="readBtn">閱讀 Read</button>
    <button id="searchBtn">搜尋 Search</button>
    <button id="bookmarksBtn">書籤 Bookmarks</button>
    <button id="settingsBtn">設定 Settings</button>
  </nav>
  <div class="settings" id="settingsPanel">
    <p class="small">Reading order 閱讀順序</p>
    <div class="mode" id="modes">
      <button data-mode="side">Side by side 並排</button>
      <button data-mode="en">English → 中文</button>
      <button class="active" data-mode="zh">中文 → English</button>
    </div>
    <div class="toggle" style="margin-top:16px;display:flex;justify-content:space-between;align-items:center;font-size:13px"><span>Show pinyin 顯示拼音</span><span class="switch on" id="pinyinSwitch" style="width:38px;height:22px;border-radius:99px;background:var(--forest);padding:3px;cursor:pointer"><span id="pinyinKnob" style="display:block;width:16px;height:16px;background:white;border-radius:50%;transform:translateX(16px)"></span></span></div>
  </div>
</aside>

<main>
<header class="topbar">
  <button class="menu" id="menu">☰</button>
  <select class="book" id="book"></select>
  <select id="chapter"></select>
  <div class="spacer"></div><div class="reader-tools" aria-label="Reading controls"><button class="toolbtn" id="fontDown" aria-label="Decrease text size">A−</button><button class="toolbtn" id="fontUp" aria-label="Increase text size">A+</button></div>
</header>

<section class="reader"><div class="searchbar" id="searchbar"><input id="searchInput" type="search" placeholder="Search the whole Bible / 搜尋整本聖經"><button id="searchGo">Search</button><button id="searchClose" aria-label="Close search">×</button></div><div id="reader"></div></section>
</main>
</div>

<script>
const BOOKS=[
{n:1,en:"Genesis",zh:"創世記",c:50,t:"OT"},{n:2,en:"Exodus",zh:"出埃及記",c:40,t:"OT"},{n:3,en:"Leviticus",zh:"利未記",c:27,t:"OT"},{n:4,en:"Numbers",zh:"民數記",c:36,t:"OT"},{n:5,en:"Deuteronomy",zh:"申命記",c:34,t:"OT"},
{n:6,en:"Joshua",zh:"約書亞記",c:24,t:"OT"},{n:7,en:"Judges",zh:"士師記",c:21,t:"OT"},{n:8,en:"Ruth",zh:"路得記",c:4,t:"OT"},{n:9,en:"1 Samuel",zh:"撒母耳記上",c:31,t:"OT"},{n:10,en:"2 Samuel",zh:"撒母耳記下",c:24,t:"OT"},
{n:11,en:"1 Kings",zh:"列王紀上",c:22,t:"OT"},{n:12,en:"2 Kings",zh:"列王紀下",c:25,t:"OT"},{n:13,en:"1 Chronicles",zh:"歷代志上",c:29,t:"OT"},{n:14,en:"2 Chronicles",zh:"歷代志下",c:36,t:"OT"},{n:15,en:"Ezra",zh:"以斯拉記",c:10,t:"OT"},
{n:16,en:"Nehemiah",zh:"尼希米記",c:13,t:"OT"},{n:17,en:"Esther",zh:"以斯帖記",c:10,t:"OT"},{n:18,en:"Job",zh:"約伯記",c:42,t:"OT"},{n:19,en:"Psalms",zh:"詩篇",c:150,t:"OT"},{n:20,en:"Proverbs",zh:"箴言",c:31,t:"OT"},
{n:21,en:"Ecclesiastes",zh:"傳道書",c:12,t:"OT"},{n:22,en:"Song of Solomon",zh:"雅歌",c:8,t:"OT"},{n:23,en:"Isaiah",zh:"以賽亞書",c:66,t:"OT"},{n:24,en:"Jeremiah",zh:"耶利米書",c:52,t:"OT"},{n:25,en:"Lamentations",zh:"耶利米哀歌",c:5,t:"OT"},
{n:26,en:"Ezekiel",zh:"以西結書",c:48,t:"OT"},{n:27,en:"Daniel",zh:"但以理書",c:12,t:"OT"},{n:28,en:"Hosea",zh:"何西阿書",c:14,t:"OT"},{n:29,en:"Joel",zh:"約珥書",c:3,t:"OT"},{n:30,en:"Amos",zh:"阿摩司書",c:9,t:"OT"},
{n:31,en:"Obadiah",zh:"俄巴底亞書",c:1,t:"OT"},{n:32,en:"Jonah",zh:"約拿書",c:4,t:"OT"},{n:33,en:"Micah",zh:"彌迦書",c:7,t:"OT"},{n:34,en:"Nahum",zh:"那鴻書",c:3,t:"OT"},{n:35,en:"Habakkuk",zh:"哈巴谷書",c:3,t:"OT"},
{n:36,en:"Zephaniah",zh:"西番雅書",c:3,t:"OT"},{n:37,en:"Haggai",zh:"哈該書",c:2,t:"OT"},{n:38,en:"Zechariah",zh:"撒迦利亞書",c:14,t:"OT"},{n:39,en:"Malachi",zh:"瑪拉基書",c:4,t:"OT"},
{n:40,en:"Matthew",zh:"馬太福音",c:28,t:"NT"},{n:41,en:"Mark",zh:"馬可福音",c:16,t:"NT"},{n:42,en:"Luke",zh:"路加福音",c:24,t:"NT"},{n:43,en:"John",zh:"約翰福音",c:21,t:"NT"},{n:44,en:"Acts",zh:"使徒行傳",c:28,t:"NT"},
{n:45,en:"Romans",zh:"羅馬書",c:16,t:"NT"},{n:46,en:"1 Corinthians",zh:"哥林多前書",c:16,t:"NT"},{n:47,en:"2 Corinthians",zh:"哥林多後書",c:13,t:"NT"},{n:48,en:"Galatians",zh:"加拉太書",c:6,t:"NT"},{n:49,en:"Ephesians",zh:"以弗所書",c:6,t:"NT"},
{n:50,en:"Philippians",zh:"腓立比書",c:4,t:"NT"},{n:51,en:"Colossians",zh:"歌羅西書",c:4,t:"NT"},{n:52,en:"1 Thessalonians",zh:"帖撒羅尼迦前書",c:5,t:"NT"},{n:53,en:"2 Thessalonians",zh:"帖撒羅尼迦後書",c:3,t:"NT"},{n:54,en:"1 Timothy",zh:"提摩太前書",c:6,t:"NT"},
{n:55,en:"2 Timothy",zh:"提摩太後書",c:4,t:"NT"},{n:56,en:"Titus",zh:"提多書",c:3,t:"NT"},{n:57,en:"Philemon",zh:"腓利門書",c:1,t:"NT"},{n:58,en:"Hebrews",zh:"希伯來書",c:13,t:"NT"},{n:59,en:"James",zh:"雅各書",c:5,t:"NT"},
{n:60,en:"1 Peter",zh:"彼得前書",c:5,t:"NT"},{n:61,en:"2 Peter",zh:"彼得後書",c:3,t:"NT"},{n:62,en:"1 John",zh:"約翰一書",c:5,t:"NT"},{n:63,en:"2 John",zh:"約翰二書",c:1,t:"NT"},{n:64,en:"3 John",zh:"約翰三書",c:1,t:"NT"},
{n:65,en:"Jude",zh:"猶大書",c:1,t:"NT"},{n:66,en:"Revelation",zh:"啟示錄",c:22,t:"NT"}
];

const bookEl=document.getElementById("book");
const chapterEl=document.getElementById("chapter");
const reader=document.getElementById("reader");
const savedState=(()=>{try{return JSON.parse(localStorage.getItem("tongdaoReaderState")||"{}")}catch(e){return{}}})();
let currentBook=Number(savedState.book)||43,
    currentChapter=Number(savedState.chapter)||3,
    mode=savedState.mode||"zh",
    showPinyin=savedState.pinyin!==undefined?!!savedState.pinyin:true,
    fontScale=Number(savedState.fontScale)||1,
    currentZh=[],currentEn=[];

function saveReaderState(){
  localStorage.setItem("tongdaoReaderState",JSON.stringify({
    book:currentBook,chapter:currentChapter,mode,pinyin:showPinyin,fontScale
  }));
}

function setupBooks(){
  const ot=document.createElement("optgroup");ot.label="舊約 · Old Testament";
  const nt=document.createElement("optgroup");nt.label="新約 · New Testament";
  BOOKS.forEach(b=>{
    const o=new Option(`${b.zh} · ${b.en}`,b.n);
    (b.t==="OT"?ot:nt).appendChild(o);
  });
  bookEl.appendChild(ot);bookEl.appendChild(nt);bookEl.value=String(currentBook);
}
function setupChapters(){
  const b=BOOKS.find(x=>x.n===currentBook);
  chapterEl.innerHTML="";
  for(let i=1;i<=b.c;i++)chapterEl.add(new Option(String(i),String(i)));
  chapterEl.value=String(Math.min(currentChapter,b.c));
}
setupBooks();setupChapters();
document.querySelectorAll("#modes button").forEach(btn=>btn.classList.toggle("active",btn.dataset.mode===mode));
const initSwitch=document.getElementById("pinyinSwitch");
const initKnob=document.getElementById("pinyinKnob");
if(initSwitch&&initKnob){
  initSwitch.style.background=showPinyin?"var(--forest)":"#c9c6bf";
  initKnob.style.transform=showPinyin?"translateX(16px)":"translateX(0)";
}


function findVerseArray(obj){
  if(!obj || typeof obj!=="object") return null;
  if(Array.isArray(obj)){
    if(obj.length && obj.every(x=>x && typeof x==="object") && obj.some(x=>("verse" in x || "verse_nr" in x) && ("text" in x || "scripture" in x))) return obj;
    for(const item of obj){const r=findVerseArray(item);if(r)return r;}
    return null;
  }
  if(Array.isArray(obj.verses)) return obj.verses;
  for(const k of Object.keys(obj)){const r=findVerseArray(obj[k]);if(r)return r;}
  return null;
}
function normaliseVerses(data){
  const arr=findVerseArray(data);
  if(!arr) return [];
  return arr.map((v,i)=>({
    n:Number(v.verse ?? v.verse_nr ?? v.number ?? (i+1)),
    text:String(v.text ?? v.scripture ?? v.value ?? "").trim()
  })).filter(v=>v.text);
}
async function fetchJSON(url){
  const r=await fetch(url,{cache:"no-store"});
  if(!r.ok)throw new Error(`${r.status} ${r.statusText}`);
  return r.json();
}
async function fetchChapter(translation,book,chapter){
  const chapterURL=`https://api.getbible.net/v2/${translation}/${book}/${chapter}.json`;
  try{
    const data=await fetchJSON(chapterURL);
    const verses=normaliseVerses(data);
    if(verses.length)return verses;
    throw new Error("No verse array in chapter response");
  }catch(firstError){
    const bookURL=`https://api.getbible.net/v2/${translation}/${book}.json`;
    const data=await fetchJSON(bookURL);
    const candidates=[];
    (function walk(o){
      if(!o||typeof o!=="object")return;
      if(Array.isArray(o)){o.forEach(walk);return;}
      const ch=Number(o.chapter ?? o.chapter_nr ?? o.number);
      if(ch===chapter){const v=normaliseVerses(o);if(v.length)candidates.push(v);}
      Object.values(o).forEach(walk);
    })(data);
    if(candidates.length)return candidates[0];
    throw firstError;
  }
}

async function load(){
  setViewHash("read");
  setReadingToolsVisible(true);
  currentBook=Number(bookEl.value);currentChapter=Number(chapterEl.value);
  reader.innerHTML='<div class="loading">正在載入經文…<br>Loading Scripture…</div>';
  try{
    const [zh,en]=await Promise.all([
      fetchChapter("cut",currentBook,currentChapter),
      fetchChapter("asv",currentBook,currentChapter)
    ]);
    currentZh=zh;currentEn=en;render(zh,en);
  }catch(err){
    console.error(err);
    reader.innerHTML=`<div class="error">這一章暫時無法載入。<br>This chapter did not load.<br><button class="retry" onclick="load()">Try again</button></div>`;
  }
}

function render(zh,en){
  const b=BOOKS.find(x=>x.n===currentBook);
  const englishByVerse=new Map(en.map(v=>[v.n,v.text]));
  reader.className="reader"+(mode==="side"?" side":"");
  let html=`<div class="heading"><h1>${b.zh} ${currentChapter}</h1><span>${b.en} ${currentChapter}</span></div>
  <div class="testament">${b.t==="OT"?"舊約 · Old Testament":"新約 · New Testament"}</div>
  <p class="translation-note">和合本（繁體字） × ASV <span style="opacity:.7">（ASV is temporary until secure ESV integration）</span></p>`;
  zh.forEach(v=>{
    const z=`<p class="zh">${escapeHtml(v.text)}</p>`;
    let pyText="";
    if(showPinyin && window.pinyinPro && window.pinyinPro.pinyin){
      try{
        pyText=window.pinyinPro.pinyin(v.text,{toneType:"symbol",type:"string",nonZh:"consecutive"});
      }catch(e){ console.warn("Pinyin error",e); }
    }
    const py=showPinyin && pyText ? `<p class="py">${escapeHtml(pyText)}</p>` : "";
    const e=`<p class="en">${escapeHtml(englishByVerse.get(v.n)||"")}</p>`;
    const chineseBlock=z+py;
    let content, contentClass="content";
    if(mode==="side"){
      contentClass+=" side-by-side";
      content=`<div class="zhcol">${chineseBlock}</div><div class="encol">${e}</div>`;
    }else{
      content=mode==="en"?e+chineseBlock:chineseBlock+e;
    }
    const saved=isBookmarked(currentBook,currentChapter,v.n);
    const bookmarkIcon=`<svg viewBox="0 0 24 28" aria-hidden="true"><path d="M5 3.5h14v21l-7-4.5-7 4.5z"/></svg>`;
    html+=`<article class="verse" id="v${v.n}" aria-label="Verse ${v.n}" data-search="${escapeHtml((v.text+" "+(englishByVerse.get(v.n)||"")).toLowerCase())}"><div class="verse-rail"><div class="num" aria-hidden="true">${v.n}</div><div class="verse-tools"><button class="verse-tool ${saved?"saved":""}" data-bookmark="${v.n}" aria-label="${saved?"Remove bookmark":"Bookmark verse"}">${bookmarkIcon}</button></div></div><div class="${contentClass}">${content}</div></article>`;
  });
  const bIndex=BOOKS.findIndex(x=>x.n===currentBook);
  const prevDisabled=currentChapter===1 && bIndex===0;
  const nextDisabled=currentChapter===b.c && bIndex===BOOKS.length-1;
  html+=`<div class="chapter-nav" aria-label="Chapter navigation"><button id="prevChapter" ${prevDisabled?"disabled":""}>← Previous</button><button id="nextChapter" ${nextDisabled?"disabled":""}>Next →</button></div>`;
  html+=`<p class="footer-note">Chinese: Union Traditional / 和合本（繁體字） via GetBible. English: American Standard Version (public domain) via GetBible, used only as a temporary working English source until ESV is connected securely.</p>`;
  reader.innerHTML=html;
  reader.style.setProperty("--readerScale",fontScale.toFixed(2));
  const prev=document.getElementById("prevChapter"), next=document.getElementById("nextChapter");
  if(prev)prev.onclick=()=>moveChapter(-1);
  if(next)next.onclick=()=>moveChapter(1);
  document.querySelectorAll("[data-bookmark]").forEach(btn=>{
    btn.onclick=()=>toggleBookmark(Number(btn.dataset.bookmark));
  });
}

function getBookmarks(){
  try{return JSON.parse(localStorage.getItem("tongdaoBookmarks")||"[]")}catch(e){return[]}
}
function saveBookmarks(items){localStorage.setItem("tongdaoBookmarks",JSON.stringify(items))}
function isBookmarked(book,chapter,verse){
  return getBookmarks().some(x=>x.book===book&&x.chapter===chapter&&x.verse===verse)
}
function toggleBookmark(verse){
  let items=getBookmarks();
  const idx=items.findIndex(x=>x.book===currentBook&&x.chapter===currentChapter&&x.verse===verse);
  if(idx>=0){items.splice(idx,1)}
  else{
    const b=BOOKS.find(x=>x.n===currentBook);
    const z=currentZh.find(x=>x.n===verse);
    const e=currentEn.find(x=>x.n===verse);
    items.push({book:currentBook,chapter:currentChapter,verse,bookZh:b.zh,bookEn:b.en,zh:z?.text||"",en:e?.text||""});
  }
  saveBookmarks(items);render(currentZh,currentEn);
}
function setActiveSection(section){
  const ids={read:'mobileRead',search:'mobileSearch',bookmarks:'mobileBookmarks',settings:'mobileSettings'};
  Object.entries(ids).forEach(([key,id])=>document.getElementById(id)?.classList.toggle('active',key===section));
  const desktop={read:'readBtn',search:'searchBtn',bookmarks:'bookmarksBtn',settings:'settingsBtn'};
  Object.entries(desktop).forEach(([key,id])=>document.getElementById(id)?.classList.toggle('active',key===section));
}

function setViewHash(view){
  const hash = view==="read" ? "#read" : `#${view}`;
  if(location.hash !== hash) history.replaceState(null,"",hash);
}

function restoreViewFromHash(){
  const view=(location.hash||"#read").replace("#","");
  if(view==="settings") showSettings();
  else if(view==="bookmarks") showBookmarks();
  else if(view==="search") openSearch();
  else showReader();
}

function setReadingToolsVisible(visible){
  const tools=document.querySelector(".reader-tools");
  if(tools)tools.style.display=visible?"flex":"none";
}

function showBookmarks(){
  setViewHash("bookmarks");
  setReadingToolsVisible(false);
  setActiveSection("bookmarks");
  const items=getBookmarks();
  const r=document.getElementById("reader");
  document.getElementById("searchbar").classList.remove("open");
  r.className="reader-view";
  if(!items.length){r.innerHTML='<h2 class="panel-title">書籤 Bookmarks</h2><div class="empty">No bookmarks yet. Tap the bookmark ribbon beside a verse to save it.</div>';return}
  r.innerHTML='<h2 class="panel-title">書籤 Bookmarks</h2><div class="bookmark-list">'+items.map((x,i)=>`<div class="bookmark-card" data-bm="${i}"><strong>${x.bookZh} ${x.chapter}:${x.verse} · ${x.bookEn}</strong><p>${escapeHtml(x.zh)}</p></div>`).join("")+'</div>';
  r.querySelectorAll("[data-bm]").forEach(card=>card.onclick=async()=>{
    const x=items[Number(card.dataset.bm)];
    currentBook=x.book;currentChapter=x.chapter;bookEl.value=String(currentBook);setupChapters();chapterEl.value=String(currentChapter);
    await load();setTimeout(()=>document.getElementById("v"+x.verse)?.scrollIntoView({behavior:"smooth",block:"center"}),150);
  });
}
function showReader(){
  setViewHash("read");
  setReadingToolsVisible(true);
  setActiveSection("read");
  document.getElementById("searchbar").classList.remove("open");
  if(currentZh.length)render(currentZh,currentEn); else load();
}
function openSearch(){
  setViewHash("search");
  setReadingToolsVisible(false);
  showReader();
  setActiveSection("search");
  const bar=document.getElementById("searchbar");
  bar.classList.add("open");
  document.getElementById("searchInput").focus();
}
let localSearchIndexPromise=null;

function flattenTranslation(data,translation){
  const rows=[];
  const seen=new Set();

  function add(book,chapter,verse,text){
    book=Number(book)||0; chapter=Number(chapter)||0; verse=Number(verse)||0;
    text=String(text||"").trim();
    if(!book||!chapter||!verse||!text)return;
    const key=`${translation}-${book}-${chapter}-${verse}`;
    if(seen.has(key))return;
    seen.add(key);
    rows.push({book,chapter,verse,text,translation,search:text.toLocaleLowerCase()});
  }

  function walk(node,ctx={book:0,chapter:0},depth=0){
    if(node==null || depth>12)return;

    if(Array.isArray(node)){
      node.forEach((item,i)=>{
        let next={...ctx};
        if(!next.book && node.length>=39 && node.length<=80) next.book=i+1;
        else if(next.book && !next.chapter && node.length<=180) next.chapter=i+1;
        walk(item,next,depth+1);
      });
      return;
    }
    if(typeof node!=="object")return;

    let book=Number(node.book_nr ?? node.book_number ?? node.book_num ?? node.book ?? ctx.book)||ctx.book||0;
    let chapter=Number(node.chapter_nr ?? node.chapter_number ?? node.chapter ?? ctx.chapter)||ctx.chapter||0;
    const verse=Number(node.verse_nr ?? node.verse_number ?? node.verse ?? node.number)||0;
    const text=node.text ?? node.scripture ?? node.verse_text ?? node.value;
    if(verse && text) add(book,chapter,verse,text);

    if(Array.isArray(node.verses)){
      node.verses.forEach((v,i)=>add(book,chapter,Number(v?.verse ?? v?.verse_nr ?? v?.number ?? i+1),v?.text ?? v?.scripture ?? v?.value ?? v?.verse_text));
    }
    if(Array.isArray(node.chapters)){
      node.chapters.forEach((ch,i)=>walk(ch,{book,chapter:Number(ch?.chapter ?? ch?.chapter_nr ?? ch?.number ?? i+1)},depth+1));
    }
    if(Array.isArray(node.books)){
      node.books.forEach((b,i)=>walk(b,{book:Number(b?.book_nr ?? b?.book_number ?? b?.number ?? i+1),chapter:0},depth+1));
    }

    for(const [key,value] of Object.entries(node)){
      if(["verses","chapters","books","text","scripture","verse_text","value"].includes(key))continue;
      if(!value || typeof value!=="object")continue;
      let next={book,chapter};
      if(/^\d+$/.test(key)){
        const n=Number(key);
        if(!next.book && n>=1&&n<=66) next.book=n;
        else if(next.book && !next.chapter && n>=1&&n<=150) next.chapter=n;
      }
      walk(value,next,depth+1);
    }
  }

  walk(data);
  return rows;
}

async function buildLocalSearchIndex(){
  if(localSearchIndexPromise)return localSearchIndexPromise;
  localSearchIndexPromise=(async()=>{
    const [cut,asv]=await Promise.all([
      fetchJSON('https://api.getbible.net/v2/cut.json'),
      fetchJSON('https://api.getbible.net/v2/asv.json')
    ]);
    return [...flattenTranslation(cut,'cut'),...flattenTranslation(asv,'asv')];
  })();
  return localSearchIndexPromise;
}

async function runSearch(){
  const raw=document.getElementById('searchInput').value.trim();
  if(!raw)return;
  setActiveSection('search');
  reader.className='reader-view';
  reader.innerHTML='<div class="search-status">Searching the whole Bible…<br>正在搜尋整本聖經…</div>';
  try{
    const url=t=>`https://search.getbible.net/v2/${t}?q=${encodeURIComponent(raw)}&scope=bible&sort=canonical&limit=500`;
    const settled=await Promise.allSettled([fetchJSON(url('cut')),fetchJSON(url('asv'))]);
    const rows=[];
    for(const [i,res] of settled.entries()){
      if(res.status!=='fulfilled') continue;
      const translation=i===0?'cut':'asv';
      const payload=res.value?.results ?? res.value;
      rows.push(...flattenTranslation(payload,translation));
    }
    const dedup=new Map();
    rows.forEach(x=>dedup.set(`${x.translation}-${x.book}-${x.chapter}-${x.verse}`,x));
    const hits=[...dedup.values()].sort((a,b)=>(a.book-b.book)||(a.chapter-b.chapter)||(a.verse-b.verse)||(a.translation.localeCompare(b.translation)));
    if(!hits.length){
      reader.innerHTML=`<div class="search-heading"><h2>搜尋 Search</h2><span>Whole Bible · 整本聖經</span></div><div class="empty">No results for “${escapeHtml(raw)}”.</div>`;
      return;
    }
    reader.innerHTML=`<div class="search-heading"><h2>搜尋 Search</h2><span>${hits.length} results · Whole Bible</span></div><div class="search-results">`+
      hits.map((x,i)=>{const b=BOOKS.find(z=>z.n===x.book);return `<article class="search-result" data-result="${i}"><strong>${b?`${b.zh} ${x.chapter}:${x.verse} · ${b.en}`:`Book ${x.book} ${x.chapter}:${x.verse}`}</strong><p>${escapeHtml(x.text)}</p><small>${x.translation==='cut'?'和合本（繁體字）':'ASV'}</small></article>`}).join('')+'</div>';
    reader.querySelectorAll('[data-result]').forEach(card=>card.onclick=async()=>{
      const hit=hits[Number(card.dataset.result)]; currentBook=hit.book;currentChapter=hit.chapter;
      bookEl.value=String(currentBook);setupChapters();chapterEl.value=String(currentChapter);saveReaderState();
      await load();setActiveSection('read');
      setTimeout(()=>document.getElementById('v'+hit.verse)?.scrollIntoView({behavior:'smooth',block:'center'}),160);
    });
  }catch(err){
    console.error(err);
    reader.innerHTML='<div class="error">Whole-Bible search could not load. Please try again.<br>整本聖經搜尋目前無法載入。</div>';
  }
}

function showSettings(){
  setViewHash("settings");
  setReadingToolsVisible(false);
  setActiveSection('settings');
  document.getElementById('searchbar').classList.remove('open');
  const bookmarks=getBookmarks();
  reader.className='reader-view settings-view';
  reader.innerHTML=`<h2 class="panel-title">設定 Settings</h2>
    <section class="settings-section">
      <h3>Reading 閱讀</h3>
      <div class="setting-row"><div class="setting-label"><strong>Reading order 閱讀順序</strong><span>Default layout when you open the reader.</span></div><div class="setting-control"><select id="settingMode"><option value="zh">中文 → English</option><option value="en">English → 中文</option><option value="side">Side by side 並排</option></select></div></div>
      <div class="setting-row"><div class="setting-label"><strong>Pinyin 拼音</strong><span>Show pronunciation below Traditional Chinese.</span></div><div class="setting-control"><button class="mini-btn" id="settingPinyin">${showPinyin?'On':'Off'}</button></div></div>
      <div class="setting-row"><div class="setting-label"><strong>Text size 字體大小</strong><span>Current size: ${Math.round(fontScale*100)}%</span></div><div class="setting-control"><button class="mini-btn" id="resetFont">Reset</button></div></div>
      <div class="setting-row"><div class="setting-label"><strong>Remember my place 記住閱讀位置</strong><span>Your current book and chapter are saved on this device.</span></div><div class="setting-control"><span class="sync-badge">On</span></div></div>
    </section>
    <section class="settings-section">
      <h3>Bookmarks 書籤</h3>
      <div class="setting-row"><div class="setting-label"><strong>${bookmarks.length} saved</strong><span>Bookmarks currently stay in this browser on this device.</span></div><div class="setting-control"><button class="mini-btn danger-btn" id="clearBookmarks">Clear</button></div></div>
    </section>
    <section class="settings-section">
      <h3>Account & Sync 帳戶與同步</h3>
      <div class="settings-note"><strong>No login needed yet.</strong><br>For the MVP, bookmarks stay private on this device. When we add cross-device sync, I recommend email magic-link / Apple / Google sign-in rather than a password. An optional <strong>@username</strong> can come later if we add sharing or community features.<br><span class="sync-badge">Cross-device sync · Later</span></div>
    </section>`;

  const modeEl=document.getElementById('settingMode');
  modeEl.value=mode;
  modeEl.onchange=()=>{mode=modeEl.value;saveReaderState();document.querySelectorAll('#modes button').forEach(btn=>btn.classList.toggle('active',btn.dataset.mode===mode));};
  document.getElementById('settingPinyin').onclick=()=>{showPinyin=!showPinyin;saveReaderState();showSettings();};
  document.getElementById('resetFont').onclick=()=>{fontScale=1;saveReaderState();reader.style.setProperty('--readerScale','1');showSettings();};
  document.getElementById('clearBookmarks').onclick=()=>{if(confirm('Clear all bookmarks?')){saveBookmarks([]);showSettings();}};
}

function moveChapter(delta){
  const bIndex=BOOKS.findIndex(x=>x.n===currentBook), b=BOOKS[bIndex];
  if(delta<0){
    if(currentChapter>1) currentChapter--;
    else if(bIndex>0){currentBook=BOOKS[bIndex-1].n;currentChapter=BOOKS[bIndex-1].c;}
  }else{
    if(currentChapter<b.c) currentChapter++;
    else if(bIndex<BOOKS.length-1){currentBook=BOOKS[bIndex+1].n;currentChapter=1;}
  }
  bookEl.value=String(currentBook);setupChapters();chapterEl.value=String(currentChapter);saveReaderState();load();window.scrollTo({top:0,behavior:"smooth"});
}
function escapeHtml(s){const d=document.createElement("div");d.textContent=s;return d.innerHTML}

bookEl.onchange=()=>{currentBook=Number(bookEl.value);currentChapter=1;setupChapters();chapterEl.value="1";saveReaderState();load()};
chapterEl.onchange=()=>{currentChapter=Number(chapterEl.value);saveReaderState();load()};
document.querySelectorAll("#modes button").forEach(btn=>btn.onclick=()=>{
  mode=btn.dataset.mode;saveReaderState();
  document.querySelectorAll("#modes button").forEach(x=>x.classList.toggle("active",x===btn));
  load();
});
document.getElementById("menu").onclick=()=>document.getElementById("app").classList.add("open");
document.getElementById("scrim").onclick=()=>document.getElementById("app").classList.remove("open");

document.getElementById("homeBtn").onclick=()=>location.href="index.html";
document.getElementById("readBtn").onclick=()=>{showReader();document.getElementById("app").classList.remove("open")};
document.getElementById("searchBtn").onclick=()=>{openSearch();document.getElementById("app").classList.remove("open")};
document.getElementById("bookmarksBtn").onclick=()=>{showBookmarks();document.getElementById("app").classList.remove("open")};
document.getElementById("settingsBtn").onclick=()=>{showSettings();document.getElementById("app").classList.remove("open")};
document.getElementById("searchGo").onclick=runSearch;
document.getElementById("searchClose").onclick=()=>document.getElementById("searchbar").classList.remove("open");
document.getElementById("searchInput").addEventListener("keydown",e=>{if(e.key==="Enter")runSearch()});

document.getElementById("fontDown").onclick=()=>{fontScale=Math.max(.75,fontScale-.1);saveReaderState();reader.style.setProperty("--readerScale",fontScale.toFixed(2));};
document.getElementById("fontUp").onclick=()=>{fontScale=Math.min(1.6,fontScale+.1);saveReaderState();reader.style.setProperty("--readerScale",fontScale.toFixed(2));};
document.getElementById("pinyinSwitch").onclick=()=>{
  showPinyin=!showPinyin;saveReaderState();
  const sw=document.getElementById("pinyinSwitch"), knob=document.getElementById("pinyinKnob");
  sw.style.background=showPinyin?"var(--forest)":"#c9c6bf";
  knob.style.transform=showPinyin?"translateX(16px)":"translateX(0)";
  load();
};

restoreViewFromHash();
</script>
